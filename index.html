<style>
/* Layout: phone-first. Sticky header = tracked wrestler + window + up-in. Below: one big "mat card" per mat (the only control most people touch),
   then a tabbed sheet (Mat 1 / Mat 2 / Log) for corrections. Every write goes through commit() which recomputes and re-renders everything. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --fg:#17191c; --muted:#5d6168; --line:#d9d5cc;
  --accent:#b8321f; --accent-fg:#ffffff; --good:#2a7a3b; --gold:#ffd54a; --gold-fg:#1a1a1a; --gold-dk:#b8860b;
  --m1:#1f4e9c; --m1bg:#e7eef9; --m2:#b8321f; --m2bg:#f9e9e6;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151618; --panel:#1f2124; --fg:#f1efe9; --muted:#a3a7ad; --line:#34373c; --accent:#e8553f; --accent-fg:#141414; --good:#5fc273;
  --m1:#3b76d1; --m1bg:#15233a; --m2:#e8553f; --m2bg:#3a1a15; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1f2124; --fg:#f1efe9; --muted:#a3a7ad; --line:#34373c; --accent:#e8553f; --accent-fg:#141414; --good:#5fc273;
  --m1:#3b76d1; --m1bg:#15233a; --m2:#e8553f; --m2bg:#3a1a15; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.3;margin:0;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fg)}
main{max-width:860px;margin:0 auto;display:grid;gap:12px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 12px;font-weight:700;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fg);color:var(--bg);border-radius:0 0 12px 12px;padding:10px 14px 12px;display:grid;gap:8px}
.hdr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.hdr .meet{font-size:12px;opacity:.85;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;background:rgba(255,255,255,.1);color:var(--bg);border:0;padding:5px 10px}
.hdr .meet::after{content:' ▾';opacity:.7}
.dlg textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:110px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.dlg .meetrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.dlg .meetrow small{display:block;color:var(--muted)}
.hdr .pick{flex:1 1 200px;display:flex;gap:6px;min-width:0}
.hdr .pick input{background:var(--bg);color:var(--fg);border:0;font-weight:600}
.hdr .pick button{background:var(--accent);color:var(--accent-fg);border:0;white-space:nowrap}
.hdr .big{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.upin{text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:6px 14px;min-width:96px}
.upin .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.upin .l{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.win .who{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.win .t{font-family:var(--display);font-weight:800;font-size:clamp(22px,6.4vw,38px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.win .eta{font-family:var(--display);font-size:18px;font-weight:600}
.win .eta b{color:var(--accent)}
.hdr .note{font-size:12px;opacity:.8}
.hdr .score{font-family:var(--display);font-size:13px;letter-spacing:.04em;background:rgba(255,255,255,.12);padding:4px 8px;border-radius:6px}
.hdr .status{font-size:11px;opacity:.7;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hdr .status button{background:var(--bg);color:var(--fg);border:0;padding:4px 10px;font-size:12px}
.hdr.flash{box-shadow:inset 0 0 0 3px var(--accent)}

/* mat cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.card{border-radius:12px;border:3px solid var(--mc);background:var(--panel);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.card{--mc:var(--m1)} .card.c0{--mc:var(--m1)} .card.c1{--mc:var(--m2)} .card.c2{--mc:#2a7a3b} .card.c3{--mc:#6d3fb3} .card.c4{--mc:#b36b00} .card.c5{--mc:#007a8a}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card h2{margin:0;background:var(--mc);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.9;white-space:nowrap}
.card .body{padding:10px 12px;display:grid;gap:8px}
.card .state{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mc);display:flex;justify-content:space-between;align-items:center}
.card .state .clock{font-family:var(--display);font-size:26px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.card .names{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.card .names button{padding:10px 6px;font-size:15px;line-height:1.15;border:2px solid var(--line);background:var(--bg);border-radius:10px;min-height:54px;white-space:normal}
.card .names button.win{border-color:var(--good);background:var(--good);color:#fff}
.card .names button.lose{opacity:.45;text-decoration:line-through}
.card .names .vs{font-family:var(--display);color:var(--muted);font-size:12px}
.card .wt{font-size:12px;color:var(--muted);text-align:center}
.card .go{display:grid;grid-template-columns:1fr auto;gap:8px}
.card .go .main{background:var(--mc);color:#fff;border:0;font-family:var(--display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:14px;border-radius:10px}
.card .go .main.end{background:var(--fg);color:var(--bg)}
.card .go .alt{font-size:12px;padding:6px 10px}
.card .foot{border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.card.idle .body{opacity:.85}
.card .tracked{background:var(--gold);color:var(--gold-fg);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}

/* tabs + sheet */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet .sec{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);padding:6px 12px;background:var(--bg);border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:2.2em 2.8em 1fr 1fr auto;gap:6px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);cursor:pointer;min-height:40px}
.r .n{color:var(--muted);font-variant-numeric:tabular-nums}
.r .w{font-weight:700}
.r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r .nm.win{color:var(--good);font-weight:700} .r .nm.win::before{content:'W '} .r .nm.lose{color:var(--muted);text-decoration:line-through}
.r .chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.r.done{color:var(--muted)} .r.done .chip{background:var(--line)}
.r.live .chip{background:var(--good);color:#fff;border-color:var(--good)}
.r.next .chip{background:var(--mc);color:#fff;border-color:var(--mc)}
.r.ours{background:var(--gold);color:var(--gold-fg)} .r.ours .n,.r.ours .nm,.r.ours .nm.lose{color:var(--gold-fg)} .r.ours .nm:first-of-type::before{content:'★ '}
.r.ff{opacity:.55}
.log{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;padding:6px 10px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.log.h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.dlg{background:var(--panel);color:var(--fg);border-radius:14px;width:min(560px,100%);padding:14px;display:grid;gap:10px;max-height:88vh;overflow:auto}
.dlg h3{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.dlg .warn{background:var(--m2bg);color:var(--fg);border:1px solid var(--accent);padding:8px 10px;border-radius:8px;font-size:13px}
.dlg .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.dlg .tl{display:flex;gap:6px}
.dlg .tl button{padding:6px 8px;font-size:12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .acts .save{background:var(--accent);color:var(--accent-fg);border:0}
.dlg .acts .danger{color:var(--accent)}
.dlg .seg{display:flex;gap:6px} .dlg .seg button{flex:1;white-space:normal} .dlg .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dlg .list{display:grid;gap:6px;max-height:50vh;overflow:auto} .dlg .list button{text-align:left;white-space:normal}
details.adv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.adv summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
details.adv .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:8px}
details.adv label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

  <header class="hdr" id="hdr">
    <div class="row"><h1>Mat Time</h1><button type="button" class="meet" id="meetTitle" title="Meets: history, new meet, roster"></button><button type="button" class="meet" id="meetStart" style="flex:0 0 auto" title="Scheduled start"></button><button type="button" class="meet" id="meetWt" style="flex:0 0 auto" title="Starting weight class"></button></div>

  <section class="cards">

window.MT_CONFIG={url:'https://neasjlyymaufxxpprduv.supabase.co',key:'sb_publishable_WFqCxeR9AjQ2ecjqryETLQ_1Xx2aDV8'};
window.MT_DB=(function(){
  var c=window.MT_CONFIG; if(!c||!c.key) return null;
  var base=c.url+'/rest/v1/docs', H={apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json'};
  var memPin='';
  function pin(){ try{ return localStorage.getItem('mt.pin')||memPin; }catch(e){ return memPin; } }
  function setPin(v){ memPin=v||''; try{ if(v) localStorage.setItem('mt.pin',v); else localStorage.removeItem('mt.pin'); }catch(e){} }
  window.MT_HASPIN=function(){ return !!pin(); };
  window.MT_NEEDPIN=function(){ if(pin()) return true; var v=window.prompt('Meet PIN (needed to make changes)'); if(v&&v.trim()){ setPin(v.trim()); return true; } return false; };
  function req(method,qs,body,extra){
    var write=method!=='GET', pv=pin();
    if(write&&!pv){ if(/guesslog/.test(qs)||(body&&/guesslog/.test(body.path||''))) return Promise.resolve(null); var le=new Error('view only'); le.code='PIN needed'; return Promise.reject(le); }
    var hd=Object.assign({},H,extra||{}); if(pv) hd['x-mt-pin']=pv;
    return fetch(base+qs,{method:method,headers:hd,body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.text().then(function(t){ if(!r.ok){ var e=new Error(t||String(r.status)); e.code=r.status; if(write&&(r.status===401||r.status===403)){ setPin(''); e.code='wrong PIN'; } throw e; } return t?JSON.parse(t):null; }); });
  }
  function snapDoc(row){ return {id:row.id,exists:true,data:function(){return row.data;}}; }
  function upsert(path,id,d){ return req('POST','?on_conflict=path',{path:path+'/'+id,coll:path,id:id,data:d,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'}); }
  function coll(path){
    function list(){ return req('GET','?select=id,data&coll=eq.'+encodeURIComponent(path)+'&limit=5000').then(function(rows){ return {docs:(rows||[]).map(snapDoc)}; }); }
    return {
      get:list,
      doc:function(id){
        var p=path+'/'+id;
        function get(){ return req('GET','?select=id,data&path=eq.'+encodeURIComponent(p)).then(function(rows){ return rows&&rows[0]?snapDoc(rows[0]):{id:id,exists:false,data:function(){return null;}}; }); }
        return { get:get,
          set:function(d){ return upsert(path,id,d); },
          update:function(d){ return get().then(function(sn){ return upsert(path,id,Object.assign({},sn.exists?sn.data():{},d)); }); },
          delete:function(){ return req('DELETE','?path=eq.'+encodeURIComponent(p)); } };
      },
      onSnapshot:function(cb,err){
        var stop=false,last=null;
        function tick(){ if(stop) return;
          list().then(function(sn){ var sig=JSON.stringify(sn.docs.map(function(d){return [d.id,d.data()];})); if(sig!==last){ last=sig; cb(sn); } })
            .catch(function(e){ if(err) err(e); })
            .then(function(){ if(!stop) setTimeout(tick,4000); }); }
        tick(); return function(){ stop=true; };
      }
    };
  }
  return {collection:coll};
})();

  // Flo observations (stamped by the server job) become bout times in memory. Rows a person timed are never touched.

      onFlo();
    }catch(e){ floNote('Flo: read failed'); }
    floBusy=false;
  }
  window.MT_FLOSYNC=floSync;
  setInterval(floSync,20000); setTimeout(floSync,4000);
  setInterval(()=>{ if(!$('modal').classList.contains('open')) renderAll(); },20000);

  let unsub=null;
  function subscribe(){ if(!db) return; try{ floSubscribe(); }catch(e){} try{ if(unsub) unsub(); }catch(e){} try{ unsub=db.collection(BOUTS()).onSnapshot(snap=>{ mergeSnap(snap); try{ applyFlo(); }catch(e){} if(!$('modal').classList.contains('open')) renderAll(); else project(); $('status').textContent='Live · '+(MEET.title||MEET.id)+' · '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}); },err=>{ $('status').textContent='Sync error: '+(err.code||err.message); }); }catch(e){ $('status').textContent='Sync unavailable: '+(e.code||e.message); } }
  // Pick up roster / start weight / Flo link changes made elsewhere without a reload.
  async function meetSync(){ if(!db||$('modal').classList.contains('open')) return;
    try{ const sn=await db.collection('meets').doc(MEET.id).get(); if(!sn||sn.exists===false) return; const x=sn.data(); if(!x||!x.mats) return;
      const old=meetsIdx[MEET.id]||{}; if((x.updatedAtMs||0)<=(old.updatedAtMs||0)) return;
      const floChanged=JSON.stringify(x.flo||[])!==JSON.stringify(old.flo||[]); meetsIdx[MEET.id]=x;
      MEET={id:MEET.id,title:x.title,start:x.start,track:x.track,prior:x.prior||null,startWt:x.startWt||null,startAt:x.startAt||null,work:x.work||null};
      if(JSON.stringify(x.mats)!==JSON.stringify(MATS)) MATS=x.mats;
      try{ localStorage.setItem('matclock.meet',JSON.stringify({...MEET,mats:MATS})); }catch(e){}
      buildRoster(); if(floChanged){ try{ floSubscribe(); }catch(e){} } try{ floRoster(); }catch(e){} try{ applyFlo(); }catch(e){} renderAll(); toast('Meet updated');
    }catch(e){} }
  setInterval(meetSync,20000);
  buildRoster(); loadLocal(); renderAll();
  (async()=>{
    db=window.MT_DB||await window.claude?.use?.('db');
    if(!db){ $('status').textContent='Not connected to shared data: saving on this phone only.'; return; }
    await loadMeetsIdx();
    try{ const cfg=await db.collection('config').doc('current').get(); const c=cfg&&cfg.exists!==false?(cfg.data?cfg.data():cfg):null;
      let cur=c&&c.id?c.id:null;
      { const t=todayId(); if(meetsIdx[t]) cur=t; else if(!cur||cur<t||!meetsIdx[cur]){ const up=Object.keys(meetsIdx).filter(i=>i>t).sort()[0]; if(up) cur=up; } }   // open today's meet by itself; otherwise the next one coming up
      if(c&&c.mats&&!meetsIdx[c.id]){ meetsIdx[c.id]=c; }   // older full-config doc
      if(cur&&meetsIdx[cur]&&meetsIdx[cur].mats&&(cur!==MEET.id||JSON.stringify(meetsIdx[cur].mats)!==JSON.stringify(MATS))){ const x=meetsIdx[cur]; MEET={id:x.id||cur,title:x.title,start:x.start,track:x.track,prior:x.prior||null,startWt:x.startWt||null,startAt:x.startAt||null,work:x.work||null}; MATS=x.mats; try{ localStorage.setItem('matclock.meet',JSON.stringify({...MEET,mats:MATS})); }catch(e){} state={}; glog={}; buildRoster(); loadLocal(); renderAll(); }
      else if(cur===MEET.id&&meetsIdx[cur]&&meetsIdx[cur].prior&&!MEET.prior){ MEET.prior=meetsIdx[cur].prior; }
    }catch(e){ $('status').textContent='Roster read failed: '+(e.code||e.message); }
    try{ const s0=await db.collection(BOUTS()).get(); const have={}; s0.docs.forEach(d=>{ have[d.id]=1; }); mergeSnap(s0); Object.keys(state).forEach(k=>{ if(!have[k]&&!(state[k]&&state[k].auto)) queue[k]=1; }); mirror(); }catch(e){}
    flush();
    try{ const gs=await db.collection(GLOG()).get(); gs.docs.forEach(d=>{ glog[d.id]=d.data(); }); mirror(); }catch(e){}
    subscribe();
  })();
})();
</script>

</body></html>
